name: Local analysis runtime
on:
  workflow_dispatch:
  push:
    paths: ['analysis/**', 'scripts/ensure-analysis.mjs', '.github/workflows/local-analysis.yml']
  pull_request:
    paths: ['analysis/**', 'scripts/ensure-analysis.mjs', '.github/workflows/local-analysis.yml']
jobs:
  native-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libgomp1 libportaudio2
      - run: python -m pip install -r analysis/requirements-build.txt
      - run: python -m unittest discover -s analysis/tests -v
      - run: python analysis/build_worker.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/ensure-analysis.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-worker-${{ runner.os }}-${{ runner.arch }}
          path: assets/analysis-worker
